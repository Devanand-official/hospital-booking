
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | SemasaCare</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/user-management.css">
</head>
<body>

    <div class="user-management-container">

        <header class="page-header">
            <div>
                <h1>User Management</h1>
                <p>Manage SemasaCare patients and staff accounts.</p>
            </div>

            <a href="dashboards/admin-dashboard.html" class="back-button">
                Back to Dashboard
            </a>
        </header>

        <section class="user-summary">
            <div class="summary-card">
                <h3>Total Users</h3>
                <p id="totalUsers">0</p>
            </div>

            <div class="summary-card">
                <h3>Patients</h3>
                <p id="totalPatients">0</p>
            </div>

            <div class="summary-card">
                <h3>Staff</h3>
                <p id="totalStaff">0</p>
            </div>
        </section>

        <section class="user-management-card">

            <div class="section-heading">
                <div>
                    <h2>All Users</h2>
                    <p>View and manage registered accounts.</p>
                </div>

                <input
                    type="search"
                    id="searchUser"
                    placeholder="Search by name or email..."
                    aria-label="Search users"
                >
            </div>

            <div class="filter-area">
                <label for="roleFilter">Filter by role:</label>

                <select id="roleFilter">
                    <option value="all">All Users</option>
                    <option value="patient">Patients</option>
                    <option value="admin">Administrators</option>
                    <option value="receptionist">Receptionists</option>
                    <option value="doctor">Doctors</option>
                    <option value="pharmacist">Pharmacists</option>
                    <option value="laboratory">Laboratory Technicians</option>
                    <option value="accountant">Accountants</option>
                </select>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Role</th>
                            <th>Account Type</th>
                        </tr>
                    </thead>

                    <tbody id="usersTableBody">
                        <tr>
                            <td colspan="5">Loading users...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <p id="userMessage" class="user-message" aria-live="polite"></p>


<section class="create-staff-card">
    <div class="section-heading">
        <div>
            <h2>Create Staff Account</h2>
            <p>Add a new employee to SemasaCare.</p>
        </div>
    </div>

    <form id="createStaffForm">

        <div class="staff-form-grid">

            <div class="form-group">
                <label for="staffName">Full Name</label>
                <input
                    type="text"
                    id="staffName"
                    placeholder="Enter full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="staffEmail">Email Address</label>
                <input
                    type="email"
                    id="staffEmail"
                    placeholder="Enter email address"
                    required
                >
            </div>

            <div class="form-group">
                <label for="staffPhone">Phone Number</label>
                <input
                    type="tel"
                    id="staffPhone"
                    placeholder="Enter phone number"
                    required
                >
            </div>

            <div class="form-group">
                <label for="staffRole">Staff Role</label>
                <select id="staffRole" required>
                    <option value="">Select staff role</option>
                    <option value="doctor">Doctor</option>
                    <option value="receptionist">Receptionist</option>
                    <option value="pharmacist">Pharmacist</option>
                    <option value="laboratory">Laboratory Technician</option>
                    <option value="accountant">Accountant</option>
                </select>
            </div>

            <div class="form-group">
                <label for="staffPassword">Temporary Password</label>
                <input
                    type="password"
                    id="staffPassword"
                    placeholder="Minimum 8 characters"
                    minlength="8"
                    required
                >
            </div>

        </div>

        <button type="submit" class="create-staff-btn">
            Create Staff Account
        </button>

        <p id="staffMessage" aria-live="polite"></p>

    </form>
</section>


        </section>
        

    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/user-management.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | SemasaCare</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/forgot-password.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="forgot-container">

        <div class="forgot-card">

            <a href="../index.html" class="brand">
                <i class="fas fa-heartbeat"></i>
                <span>SemasaCare</span>
            </a>

            <div class="forgot-icon">
                <i class="fas fa-lock"></i>
            </div>

            <h1>Forgot Password?</h1>

            <p class="description">
                Don't worry! Enter your registered email address
                and we'll help you recover access to your account.
            </p>

            <form id="forgotPasswordForm">

                <div class="form-group">
                    <label for="email">Registered Email Address</label>

                    <div class="input-box">
                        <i class="fas fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            required
                        >
                    </div>
                </div>

                <p id="forgotMessage" class="forgot-message"></p>

                <button type="submit" class="reset-btn">
                    Send Reset Instructions
                </button>

            </form>

            <a href="login.html" class="back-login">
                <i class="fas fa-arrow-left"></i>
                Back to Login
            </a>

            <div class="forgot-footer">
                <p>Your Health, Our Priority</p>
                <span>© 2026 SemasaCare. All Rights Reserved.</span>
            </div>

        </div>

    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/forgot-password.js"></script>

</body>
</html>

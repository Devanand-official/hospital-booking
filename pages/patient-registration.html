
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Registration | SemasaCare</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/patient-registration.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="dashboard-container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="sidebar-brand">
                <i class="fas fa-heartbeat"></i>
                <span>SemasaCare</span>
            </div>

            <div class="sidebar-profile">
                <div class="profile-icon">
                    <i class="fas fa-user-tie"></i>
                </div>

                <div>
                    <h3 id="staffName">Staff</h3>
                    <p id="staffRole">Receptionist</p>
                </div>
            </div>

            <nav class="sidebar-menu">

                <p class="menu-heading">MAIN MENU</p>

                <a href="dashboards/receptionist-dashboard.html" class="menu-item">
                    <i class="fas fa-chart-pie"></i>
                    <span>Dashboard</span>
                </a>

                <a href="appointments.html" class="menu-item">
                    <i class="fas fa-calendar-check"></i>
                    <span>Manage Appointments</span>
                </a>

                <a href="patient-registration.html" class="menu-item active">
                    <i class="fas fa-user-plus"></i>
                    <span>Register Patient</span>
                </a>

                <a href="patient-list.html" class="menu-item">
                    <i class="fas fa-user-injured"></i>
                    <span>Patient Records</span>
                </a>

                <a href="doctors.html" class="menu-item">
                    <i class="fas fa-user-doctor"></i>
                    <span>Doctors</span>
                </a>

            </nav>

            <button class="logout-btn" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </button>

        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Header -->
            <header class="top-header">

                <div class="header-left">

                    <button id="menuToggle" class="menu-toggle">
                        <i class="fas fa-bars"></i>
                    </button>

                    <div>
                        <h2>Patient Registration</h2>
                        <p>Register a new hospital patient</p>
                    </div>

                </div>

                <div class="header-right">

                    <div class="header-user">
                        <div class="header-avatar">
                            <i class="fas fa-user-tie"></i>
                        </div>

                        <div>
                            <h4 id="headerName">Staff</h4>
                            <p id="headerRole">Receptionist</p>
                        </div>
                    </div>

                </div>

            </header>

            <!-- Registration Content -->
            <section class="dashboard-content">

                <div class="page-heading">
                    <div>
                        <h1>Register New Patient</h1>
                        <p>Enter the patient's personal and contact information.</p>
                    </div>
                </div>

                <div class="section-card registration-card">

                    <div class="section-heading">
                        <h2>
                            <i class="fas fa-user-plus"></i>
                            Patient Information
                        </h2>
                    </div>

                    <div id="registrationMessage" class="form-message"
                        role="alert" aria-live="polite"></div>

                    <form id="patientRegistrationForm">

                        <div class="registration-grid">

                            <div class="form-group">
                                <label for="fullName">Full Name *</label>
                                <input
                                    type="text"
                                    id="fullName"
                                    name="fullName"
                                    placeholder="Enter patient's full name"
                                    required>
                            </div>

                            <div class="form-group">
                                <label for="email">Email Address *</label>
                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    placeholder="Enter email address"
                                    required>
                            </div>

                            <div class="form-group">
                                <label for="phone">Phone Number *</label>
                                <input
                                    type="tel"
                                    id="phone"
                                    name="phone"
                                    placeholder="Enter 10-digit phone number"
                                    maxlength="10"
                                    required>
                            </div>

                            <div class="form-group">
                                <label for="dob">Date of Birth *</label>
                                <input
                                    type="date"
                                    id="dob"
                                    name="dob"
                                    required>
                            </div>

                            <div class="form-group">
                                <label for="gender">Gender *</label>
                                <select id="gender" name="gender" required>
                                    <option value="">Select gender</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="bloodGroup">Blood Group</label>
                                <select id="bloodGroup" name="bloodGroup">
                                    <option value="">Select blood group</option>
                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B-">B-</option>
                                    <option value="AB+">AB+</option>
                                    <option value="AB-">AB-</option>
                                    <option value="O+">O+</option>
                                    <option value="O-">O-</option>
                                </select>
                            </div>

                            <div class="form-group full-width">
                                <label for="address">Residential Address *</label>
                                <textarea
                                    id="address"
                                    name="address"
                                    rows="3"
                                    placeholder="Enter patient's full address"
                                    required></textarea>
                            </div>

                            <div class="form-group full-width">
                                <label for="emergencyContact">
                                    Emergency Contact Number
                                </label>
                                <input
                                    type="tel"
                                    id="emergencyContact"
                                    name="emergencyContact"
                                    maxlength="10"
                                    placeholder="Enter emergency contact number">
                            </div>

                        </div>

                        <div class="form-actions">

                            <button type="reset" class="reset-btn">
                                <i class="fas fa-rotate-left"></i>
                                Clear Form
                            </button>

                            <button type="submit" class="submit-btn">
                                <i class="fas fa-user-plus"></i>
                                Register Patient
                            </button>

                        </div>

                    </form>

                </div>

            </section>

        </main>

    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/patient-registration.js"></script>

</body>
</html>
